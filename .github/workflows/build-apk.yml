name: Build BASOKA APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create environment configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASOKA-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release and Upload APK (on push or manual trigger)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BASOKA v1.0.${{ github.run_number }}"
          body: |
            ## BASOKA - Kurdish AI Assistant 🚀
            وەشانی فەرمی ئەپڵیکەیشنی BASOKA بە زمانی کوردی.

            ### تایبەتمەندییەکان:
            - یاریدەدەری زیرەک بە زمانی کوردیی سۆرانی (Kurdish NLP).
            - دروستکردن و شیکارکردنی وێنە بە ژیری دەستکرد (AI Image Generation).
            - تایمەر، زەنگ، بیرخستنەوە و بەڕێوەبردنی کارەکان.
            - کورتکردنەوە و شیکردنەوەی فایل و بەڵگەنامەکان.
            - پاراستنی تەواوی داتاکان لە ناوخۆی مۆبایل (Offline First).

            **فایلی APK لە خوارەوە دابەزێنە و لەسەر مۆبایلەکەت دایمەزرێنە.**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
